name: DentalCare Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'pom.xml'
      - 'packaging/**'
      - 'src/**'

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install WiX Toolset
        shell: powershell
        run: choco install wixtoolset --no-progress -y

      - name: Add WiX to PATH
        shell: powershell
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Select-Object -First 1
          if (-not $wix) { throw 'No se encontró WiX Toolset.' }
          "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: powershell
        run: .\packaging\windows\build-installer.ps1

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: DentalCare-Windows-Installer
          path: target/installer/*.msi
          if-no-files-found: error
